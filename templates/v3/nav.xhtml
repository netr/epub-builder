<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="{{lang_attr}}" xml:lang="{{lang_attr}}">
<head>
  <meta charset="utf-8" />
  <meta name="generator" content="{{generator_attr}}" />
  <title>{{toc_name}}</title>
  <link rel="stylesheet" type="text/css" href="css/style.css" />
</head>
<body>
  <nav epub:type="toc" id="toc" role="doc-toc" aria-labelledby="toc-title">
    <h1 id="toc-title">{{toc_name}}</h1>
{{content}}
  </nav>
  {{#if landmarks}}{{landmarks}}
  <nav epub:type="landmarks" role="navigation" aria-label="Landmarks">
{{landmarks}}
  </nav>{{/if}}
</body>
</html>
